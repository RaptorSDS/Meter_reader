# Baut die tkinter-Version mit PyInstaller für Windows (EXE), Linux und macOS.
# - Windows: Meter_reader.exe
# - Linux:   Meter_reader-linux-x86_64.tar.gz (Programm + install.sh für das Startmenü)
# - macOS:   Meter_reader-macos-arm64.zip (Meter_reader.app, Apple Silicon)
# - Bei jedem Push auf main (Änderungen im tkinter-Ordner) und bei manuellem Start:
#   die Dateien werden als Artefakte am Workflow-Lauf bereitgestellt.
# - Bei jedem Pull Request auf main: Probebau, damit der Check "build" vor dem Merge
#   grün sein muss. Ein PR veröffentlicht nie ein Release.
# - Release veröffentlichen, auf zwei Wegen:
#   a) Actions -> "EXE bauen (tkinter)" -> "Run workflow" mit Haken bei "Release erstellen".
#      Der Tag wird automatisch als "v" + VERSION aus tkinter/Meter_reader.py angelegt.
#   b) Einen Tag wie v1.1.0-beta pushen (muss zu VERSION im Programm passen).
#   Jedes Release wird als neueste Version ("Latest") angezeigt, Beta-Versionen erhalten einen Hinweis im Text.
name: EXE bauen (tkinter)

on:
  push:
    branches: [main]
    paths:
      - "tkinter/**"
      - ".github/workflows/build-exe.yml"
    tags:
      - "v*"
  # Ohne paths-Filter, damit der Pflicht-Check bei jedem PR gemeldet wird
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Release mit der Version aus tkinter/Meter_reader.py erstellen"
        type: boolean
        default: false

permissions:
  contents: write  # nötig, um ein Release anzulegen

jobs:
  # Windows-Build; der Jobname "build" ist der Pflicht-Check für Pull Requests auf main
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        # Im tkinter-Ordner bauen, damit der Ordnername "tkinter" im Repo-Hauptverzeichnis
        # nicht mit dem Python-Modul tkinter verwechselt wird
        working-directory: tkinter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Version aus dem Programm lesen
        id: version
        shell: python
        run: |
          import os, re, sys
          code = open("Meter_reader.py", encoding="utf-8").read()
          version = re.search(r'^VERSION = "([^"]+)"', code, re.M).group(1)
          tag = f"v{version}"
          print(f"VERSION im Programm: {version}")
          # Bei einem Tag-Push muss der Tag zur Version im Programm passen
          if os.environ["GITHUB_REF"].startswith("refs/tags/") and os.environ["GITHUB_REF_NAME"] != tag:
              sys.exit(f"Tag {os.environ['GITHUB_REF_NAME']} passt nicht zu VERSION {version} in tkinter/Meter_reader.py")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag={tag}\n")

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: EXE bauen
        run: pyinstaller --onefile --windowed --name Meter_reader --collect-submodules smllib Meter_reader.py

      - name: EXE als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Meter_reader-${{ steps.version.outputs.tag }}-windows
          path: tkinter/dist/Meter_reader.exe


  build-linux:
    # Älteres Ubuntu, damit das Programm auch auf älteren Distributionen läuft (glibc)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tkinter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Programm bauen
        run: pyinstaller --onefile --windowed --name Meter_reader --collect-submodules smllib Meter_reader.py

      - name: Paket packen
        run: |
          mkdir -p package/Meter_reader
          cp dist/Meter_reader linux/install.sh package/Meter_reader/
          chmod +x package/Meter_reader/Meter_reader package/Meter_reader/install.sh
          tar -czf Meter_reader-linux-x86_64.tar.gz -C package Meter_reader

      - name: Paket als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Meter_reader-linux
          path: tkinter/Meter_reader-linux-x86_64.tar.gz

  build-macos:
    # macos-latest läuft auf Apple Silicon (arm64)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tkinter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: App bauen
        # Unter macOS erzeugt --windowed ein App-Bundle (Meter_reader.app)
        run: pyinstaller --windowed --name Meter_reader --collect-submodules smllib Meter_reader.py

      - name: App packen
        # ditto erhält Rechte und Symlinks im App-Bundle
        run: ditto -c -k --keepParent dist/Meter_reader.app Meter_reader-macos-arm64.zip

      - name: App als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Meter_reader-macos
          path: tkinter/Meter_reader-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    needs: [build, build-linux, build-macos]
    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Smart Meter Ausleser ${{ needs.build.outputs.tag }}
          files: |
            release/Meter_reader.exe
            release/Meter_reader-linux-x86_64.tar.gz
            release/Meter_reader-macos-arm64.zip
          fail_on_unmatched_files: true
          # Kein Pre-release, damit GitHub das Release in der Seitenleiste als "Latest" anzeigt;
          # Beta-Versionen erkennt man am Tag/Namen und am Hinweis im Text
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ${{ contains(needs.build.outputs.tag, 'beta') && '**Hinweis: Beta-Version.** Bitte Fehler als Issue melden.' || '' }}

            | System | Datei | Start |
            |---|---|---|
            | Windows 10/11 | `Meter_reader.exe` | Herunterladen und starten |
            | Linux (x86_64) | `Meter_reader-linux-x86_64.tar.gz` | Entpacken, `./Meter_reader` starten oder `sh install.sh` für den Startmenü-Eintrag |
            | macOS (Apple Silicon) | `Meter_reader-macos-arm64.zip` | Entpacken, beim ersten Start Rechtsklick auf `Meter_reader.app` → „Öffnen“ |
